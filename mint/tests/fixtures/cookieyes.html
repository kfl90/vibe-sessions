<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>CookieYes fixture + scroll lock</title>
  <script src="common.js"></script>
  <style>
    .cky-consent-container { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid #999; z-index: 9999; padding: 16px; }
    .cky-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 9998; }
  </style>
</head>
<body style="overflow: hidden">
  <h1>Site content</h1>
  <div class="cky-overlay"></div>
  <div class="cky-consent-container">
    <p>We use cookies…</p>
    <button class="cky-btn-accept">Accept All</button>
    <button class="cky-btn-reject" data-cky-tag="reject-button">Reject All</button>
  </div>
  <script>
    document.querySelector('.cky-btn-accept').addEventListener('click', () => record('accepted'));
    document.querySelector('.cky-btn-reject').addEventListener('click', () => {
      record('rejected');
      document.querySelector('.cky-consent-container').remove();
      // NOTE: the real widget also removes .cky-overlay and the body scroll
      // lock — this fixture deliberately leaves both so the test proves the
      // extension's own cleanup handles leftovers.
    });
  </script>
</body>
</html>
