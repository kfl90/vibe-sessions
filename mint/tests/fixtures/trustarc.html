<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>TrustArc fixture</title>
  <script src="common.js"></script>
  <style>
    #truste-consent-track { position: fixed; bottom: 0; left: 0; right: 0; background: #f5f5f5; z-index: 9999; padding: 16px; }
  </style>
</head>
<body>
  <h1>Site content</h1>
  <div id="truste-consent-track">
    <p>This site uses cookies…</p>
    <button id="truste-consent-button">Accept All</button>
    <button id="truste-consent-required">Required Only</button>
  </div>
  <script>
    document.getElementById('truste-consent-button').addEventListener('click', () => record('accepted'));
    document.getElementById('truste-consent-required').addEventListener('click', () => {
      record('rejected');
      document.getElementById('truste-consent-track').remove();
    });
  </script>
</body>
</html>
