<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Late-injected banner fixture</title>
  <script src="common.js"></script>
</head>
<body>
  <h1>Site content</h1>
  <script>
    // Banner mounts 3 s after load — exercises the MutationObserver path.
    setTimeout(() => {
      const wrap = document.createElement('div');
      wrap.id = 'onetrust-consent-sdk';
      wrap.innerHTML =
        '<div id="onetrust-banner-sdk" style="position:fixed;bottom:0;left:0;right:0;background:#eee;z-index:9999;padding:20px">' +
        '<button id="onetrust-accept-btn-handler">Accept All Cookies</button>' +
        '<button id="onetrust-reject-all-handler">Reject All</button></div>';
      document.body.appendChild(wrap);
      wrap.querySelector('#onetrust-accept-btn-handler').addEventListener('click', () => record('accepted'));
      wrap.querySelector('#onetrust-reject-all-handler').addEventListener('click', () => {
        record('rejected');
        wrap.remove();
      });
    }, 3000);
  </script>
</body>
</html>
